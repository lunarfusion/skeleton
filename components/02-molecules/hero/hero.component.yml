name: Hero
description: "A large banner containing an image and text which frequently preceeds the main content of a page."
status: experimental
group: "Molecules"

props:
  type: object
  properties:
    layout:
      title: Layout
      type: string
      description: "Layout options for the hero."
      enum:
        - layout-default
        - layout-diptych
      default: layout-default

    height:
      title: Hero Height
      type: string
      description: "What height should the hero be?"
      enum:
        - height-default
        - height-medium
        - height-tall
      default: height-default

slots:

  image:
    title: Hero Image

  heading:
    title: Hero Heading

  text:
    title: Hero Text
