name: Link
description: A hyperlink
status: experimental
group: "Atoms"
links:
  - "https://github.com/lunarfusion/skeleton"

variants:
  default:
    title: Default
  quiet:
    title: Quiet
  cta:
    title: CTA
  external:
    title: External

props:
    type: object
    properties:

    url:
      title: URL
      description: "The link URL."
      $ref: "ui-patterns://url"

    size:
      type: string
      title: Link Size
      description: "The font size of the link"
      enum:
        - XS
        - S
        - M
      default: M

    disabled:
      type: boolean
      description: Link is disabled
      enum:
        - true
        - false
      default: false

slots:
  label:
    title: Label
    description: 'Label text of the link'
