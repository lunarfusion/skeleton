name: Title
description: Title of a page, section, or component.
group: "Atoms"
status: experimental
links:
   - "https://github.com/lunarfusion/skeleton"

variants:
  default:
    title: Default
  page:
    title: Page
  feature-page:
    title: Feature Page
  section:
    title: Section
  block:
    title: Block
  card:
   title: Card
  alert:
    title: Alert

props:
  type: object
  properties:

    size:
      title: Size
      type: string
      description: 'Title size vaiants: extra large, large, medium, small.'
      enum:
        - S
        - M
        - L
        - XL
      default: L

    heading_level:
      type: integer
      description: Title of a piece of content or a component
      default: 3
      enum:
        - 1
        - 2
        - 3
        - 4
        - 5
        - 6

slots:
  content:
    title: Content
    description: 'Content text of the title'
